services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: media
    ports:
      - '${POSTGRES_HOST_PORT:-5449}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d media']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  # One-off job: applies migrations, then exits.
  migrate:
    build: .
    command: ['alembic', 'upgrade', 'head']
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/media
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/media
      SECRETS_SOURCE: local
      LOCAL_STORAGE_DIR: /app/data/storage
    ports:
      - '${API_HOST_PORT:-8000}:8000'
    volumes:
      - storage:/app/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Same image, second entrypoint: claims processing jobs. Shares the storage volume with the API.
  worker:
    build: .
    command: ['python', '-m', 'scripts.start_with_secrets', 'worker']
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/media
      SECRETS_SOURCE: local
      LOCAL_STORAGE_DIR: /app/data/storage
    volumes:
      - storage:/app/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  storage:
